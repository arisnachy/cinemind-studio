name: CINEMIND CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Import backend application
        env:
          PYTHONPATH: backend
        run: python -c "import app.main; print('CINEMIND backend import OK')"

      - name: Cast speaker contract regression
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from app.episode_render import _resolve_cast_name

          cast = ["Vespera Thorne", "Maya Solis"]
          assert _resolve_cast_name("Dra. Vespera Thorne", cast, ["Vespera Thorne"]) == "Vespera Thorne"
          assert _resolve_cast_name("DR VESPERA THORNE", cast, ["Vespera Thorne"]) == "Vespera Thorne"
          assert _resolve_cast_name("Vespera Thorne, Dra.", cast, ["Vespera Thorne"]) == "Vespera Thorne"
          assert _resolve_cast_name("persona desconocida", cast, ["Vespera Thorne", "Maya Solis"]) == ""
          print("Cast speaker contract OK")
          PY

      - name: Veo LRO quota controller regression
        env:
          PYTHONPATH: backend
          VEO_LRO_MAX_INFLIGHT: '2'
        run: |
          python - <<'PY'
          from app.video_service import VideoService

          service = VideoService()
          quota_error = Exception("429 RESOURCE_EXHAUSTED long_running_online_prediction_requests_per_base_model")
          assert service._is_quota_error(quota_error)
          assert service.quota_status()["adaptiveLroLimit"] == 2
          service._active_lros = 1
          service._penalize_quota(0.01, "veo-test")
          status = service.quota_status()
          assert status["adaptiveLroLimit"] == 1
          assert status["activeLros"] == 0
          print("Veo LRO quota controller OK")
          PY

      - name: Veo 3.1 request contract regression
        env:
          PYTHONPATH: backend
          VEO_AUDIO_MODEL: veo-3.1-lite-generate-001
          VEO_VISUAL_MODEL: veo-3.1-fast-generate-001
          VEO_DURATION_SECONDS: '8'
        run: |
          python - <<'PY'
          from google.genai import types
          from app.video_service import VideoService

          service = VideoService()
          status = service.contract_status()
          assert status["ok"] is True, status
          assert status["checks"]["audio"]["promptEnhancement"] == "managed-by-veo"
          assert status["checks"]["visual"]["promptEnhancement"] == "managed-by-veo"

          valid = {
              "number_of_videos": 1,
              "duration_seconds": 8,
              "aspect_ratio": "16:9",
              "output_gcs_uri": "gs://preflight-only/",
          }
          service._validate_request_contract(
              model="veo-3.1-lite-generate-001",
              config_kwargs=valid,
          )
          types.GenerateVideosConfig(**valid)

          invalid = dict(valid)
          invalid["enhance_prompt"] = False
          try:
              service._validate_request_contract(
                  model="veo-3.1-lite-generate-001",
                  config_kwargs=invalid,
              )
          except RuntimeError as exc:
              assert "prompt enhancement cannot be disabled" in str(exc).lower()
          else:
              raise AssertionError("Veo 3.1 enhance_prompt=False must be rejected before network use")

          print("Veo 3.1 request contract OK")
          PY
