[project]
name = "cinemind-backend"
version = "0.2.0"
description = "CINEMIND Studio Google Cloud agent runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "google-genai>=1.33,<2",
  "google-adk[gcp]>=2.0.0,<3",
  "mcp-clickhouse>=0.3.0,<1",
  "clickhouse-connect>=0.11,<1",
  "google-cloud-storage>=3.2,<4",
]

[tool.uv]
dev-dependencies = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
